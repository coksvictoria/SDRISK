name: example_public_tier
release_tier: public
output:
  min_cell_size: 6 # TODO(confirm): agency output rule
  rounding_base: 3 # TODO(confirm): agency output rule
variables:
  qi_sets:
    - name: demo_core
      columns: [age_band, sex, region]
    - name: demo_extended
      columns: [age_band, sex, region, ethnicity]
  sensitive: [income_band, health_flag]
  strata: [ethnicity, region, age_band]
identity:
  k_profile_thresholds: [2, 5, 10]
row_risk:
  medium_min_flags: 1 # TODO(confirm)
  high_min_flags: 2 # TODO(confirm)
distance:
  max_rows_exact: 200000
  subsample_rows: 50000
  near_match_threshold: 0.05 # TODO(confirm)
clusters:
  k: 20
  min_cluster_size: 50
  seeds: 5
thresholds:
  exact_match_rate: {review: 0.001, fail: 0.01} # TODO(confirm)
  repu_pct: {review: 0.5, fail: 2.0} # TODO(confirm)
  disco_gain: {review: 0.02, fail: 0.05} # TODO(confirm)
  mia_auc: {review: 0.55, fail: 0.65} # TODO(confirm)
  dcr_overfit_share: {review: 0.55, fail: 0.65} # TODO(confirm)
policy:
  require_test_for_public_tier: true # TODO(confirm)
