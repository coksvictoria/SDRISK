[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdrisk"
version = "0.0.0"
description = "Disclosure-risk decision support for synthetic tabular data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TODO(confirm)" }]
keywords = ["synthetic-data", "disclosure-risk", "privacy", "statistics"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=17.0",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "Jinja2>=3.1",
  "typer>=0.12",
]

[project.scripts]
sdrisk = "sdrisk.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.112",
  "mypy>=1.11",
  "pandas-stubs>=2.1",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdrisk = ["py.typed", "report/templates/*.html"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sdrisk"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.uv]
package = true
